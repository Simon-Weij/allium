services:
  app:
    build: .
    pull_policy: build
    ports:
      - "8080:8080"
    environment:
      CONFIG_PATH: /config/config.toml
    volumes:
      - ./config/config.toml:/config/config.toml:ro
      - data:/data
    develop:
      watch:
        - action: rebuild
          path: .
volumes:
  data: